<!doctype html>
<html lang="en">

        text-align: center;
        box-shadow: 0 0 20px #ff3366;

      h1 {
        font-size: 2.2rem;
        margin-top: 0;
        text-transform: uppercase;
      }
      .warn {
        font-size: 1.3rem;
        color: #ffcc00;
      }
      .note {
        font-size: 1.1rem;
        color: #aaa;
      }
      a {
        color: #00ff00;
        font-size: 1.2rem;
      }
      a:focus-visible {
        outline: 2px dashed #00ff00;
        outline-offset: 4px;
      }
