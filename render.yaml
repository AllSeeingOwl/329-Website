services:
  - type: web
    name: 329-website-arg
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAINTENANCE_MODE
        value: 'false'
      - key: STUDIO_MAINTENANCE_MODE
        value: 'false'
      - key: MLTK_MAINTENANCE_MODE
        value: 'false'
      - key: EMERGENCY_LOCKDOWN
        value: 'false'
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: STOREFRONT_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
