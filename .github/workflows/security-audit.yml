name: npm Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0'  # Weekly on Sunday at 1 AM

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Gate on what ships: runtime dependencies must be clean.
      # (`npm audit fix` was removed: its changes were never committed, and it
      # failed the job whenever an advisory had no non-breaking fix.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Dev tooling (Jest, Vite, ESLint, knip, lint-staged) never runs in
      # production and only matches globs from our own config, so advisories
      # there are reported for visibility but do not fail the build.
      # Dependabot picks up fixes once upstream publishes them.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
